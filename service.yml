---
- name: Playbook demonstrativo do módulo systemd
  hosts: gerenciado
  become: true
  tasks:
    - name: Inicia e ativa na inicialização o serviço httpd
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true

    - name: Inicia e ativa na inicialização o serviço firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
