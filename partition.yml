---
- name: Playbook demonstrativo do módulo parted
  hosts: gerenciado
  become: true
  tasks:
    - name: Create partitions
      loop:
        - /dev/nvme1n1
        - /dev/nvme2n1
      community.general.parted:
        device: "{{ item }}"
        number: 1
        state: present
        part_end: 1GiB
        label: msdos
        flags:
          - lvm
