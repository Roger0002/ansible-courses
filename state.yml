---
- name: Install backup software
  hosts: all
  become: true
  tasks:
    - name: yum command
      ignore_errors: true
      ansible.builtin.yum:
        name: linuxacademy-backup-software
        state: present

    - name: Populate file with IP addresses
      when: ansible_facts['os_family'] == 'RedHat'
      ansible.builtin.lineinfile:
        path: /root/addresses
        line: "{{ ansible_facts['all_ipv4_addresses'] }}"
        create: true

- name: Install httpd
  hosts: webservers
  become: true
  tasks:
    - name: httpd install
      ansible.builtin.yum:
        name: httpd
        state: present

    - name: Service management for httpd
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Create and populate index.html
      ansible.builtin.lineinfile:
        path: /var/www/html/index.html
        line: Waiting for content...
        create: true
        owner: apache
        group: apache
        mode: 420

- name: DB Server management
  hosts: dbservers
  become: true
  tasks:
    - name: Add user
      ansible.builtin.user:
        name: dba
        state: present

    - name: Copy DB user data
      ansible.builtin.copy:
        src: /root/DBAstuff.txt
        dest: /home/dba/DBAstuff.txt
        owner: dba
        group: dba
        mode: 384

- name: Enable devs to easily populate content
  hosts: webservers:dbservers
  become: true
  tasks:
    - name: Install git
      ansible.builtin.yum:
        name: git
        state: present
