---
- name: Playbook demonstrativo do módulo cron
  hosts: gerenciado
  become: true
  tasks:
    - name: perform a weekly yum update
      ansible.builtin.cron:
        name: Weekly yum update
        minute: "*"
        hour: "2"
        day: "*"
        month: "*"
        weekday: "0"
        user: root
        state: present
        job: yum -y update

    - name: criação de arquivo mensalmente
      ansible.builtin.cron:
        name: Criação - Monitoração
        minute: "0"
        hour: "0"
        day: "1"
        user: root
        state: present
        job: ": > /tmp/monitFile"
