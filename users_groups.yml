---
- name: Playbook demonstrativos do uso dos módulos que tratam grupos e usuários
  hosts: gerenciado
  become: true
  tasks:
    - name: create groups
      loop:
        - students
        - bayside
      ansible.builtin.group:
        name: "{{ item }}"
        state: present

    - name: create zach user
      ansible.builtin.user:
        name: zach
        comment: Zach Morris
        shell: /bin/sh
        groups: students,bayside
        append: true
        state: present

    - name: create kelly user
      ansible.builtin.user:
        name: kelly
        comment: Kelly Kapowski
        uid: 1050
        groups: students,bayside
        append: true
        state: present

    - name: create slater user
      ansible.builtin.user:
        name: slater
        comment: ac Slater
        uid: 1051
        groups: students,bayside
        append: true
        state: present
