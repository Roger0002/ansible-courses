---
- name: Playbook que demonstra o uso de variáveis em arquivos separados (e em lista)
  hosts: gerenciado
  become: true
  gather_facts: false
  vars_files: ./user_info.yml
  tasks:
    - name: Create users
      loop: "{{ users }}"
      ansible.builtin.user:
        name: "{{ item.name }}"
        state: present
        comment: "{{ item.comment }}"
        uid: "{{ item.id }}"
