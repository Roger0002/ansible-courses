---
- name: Playbook demonstrativo do módulo at
  become: true
  hosts: gerenciado
  tasks:
    - name: install at
      ansible.builtin.yum:
        name: at
        state: latest

    - name: copy httpd error log
      ansible.posix.at:
        command: cp /var/log/httpd/error_log ~cloud_user/
        count: 2
        units: hours
        state: present
