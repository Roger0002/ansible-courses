---
- name: Playbook demonstrativo de alguns módulos de segurança (selinux, sefcontext e seboolean)
  hosts: gerenciado
  become: true
  tasks:
    - name: set selinux mode to enforcing
      ansible.posix.selinux:
        policy: targeted
        state: enforcing

    - name: enable httpd cgi boolean
      ansible.posix.seboolean:
        name: httpd_enable_cgi
        state: true
        persistent: true

    - name: set secontext
      community.general.sefcontext:
        target: /webcontent(/.*)?
        setype: httpd_sys_content_t
        state: present

    - name: run restorecon
      ansible.builtin.command: restorecon -irv /webcontent
