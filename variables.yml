---
- name: Playbook demonstrativo de variáveis
  hosts: gerenciado
  become: true
  vars_files: /home/cloud_user/ansible-courses/vars/users.yml
  tasks:
    - name: create users
      loop: "{{ [students,faculty]|flatten(1) }}"
      ansible.builtin.user:
        name: "{{ item }}"
        state: present
