---
- name: Playbook do hands-on lab de criação, formatação e montagem de LV
  hosts: dbservers
  become: true
  tasks:
    - name: Create the Volume Group
      community.general.lvg:
        vg: RHCE
        pvs: /dev/xvdg

    - name: Create Logical Volume
      community.general.lvol:
        lv: AppDB2
        vg: RHCE
        size: 10G
        pvs: /dev/xvdg
        state: present

    - name: Format the disk
      community.general.filesystem:
        dev: /dev/RHCE/AppDB2
        fstype: xfs

    - name: Mount the disk
      ansible.posix.mount:
        fstype: xfs
        src: /dev/RHCE/AppDB2
        state: mounted
        path: /mnt/appdb2
