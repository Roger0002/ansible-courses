---
- name: Playbook para adicionar um repositório
  hosts: gerenciado
  become: true
  tasks:
    - name: Add EPEL Repo
      ansible.builtin.yum_repository:
        name: epel
        description: EPEL YUM repo
        baseurl: https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm
